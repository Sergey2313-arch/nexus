name: Windows build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build NEXUS/NEXUS.csproj -c Debug -p:Platform=x64 -p:RuntimeIdentifier=win-x64
      - run: dotnet run --project tests/SecurityScanner.Checks/SecurityScanner.Checks.csproj
      - name: Publish Windows x64 folder
        run: dotnet publish NEXUS/NEXUS.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishProfile= -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:PublishSingleFile=false -o artifacts/NEXUS-win-x64
      - name: Verify published dependencies and prepare download
        shell: pwsh
        run: |
          $folder = Join-Path $PWD 'artifacts/NEXUS-win-x64'
          foreach ($file in @('NEXUS.exe', 'NEXUS.dll', 'coreclr.dll', 'Microsoft.UI.Xaml.dll', 'e_sqlite3.dll')) {
            if (-not (Test-Path (Join-Path $folder $file))) { throw "Missing published dependency: $file" }
          }
          Copy-Item WINDOWS-BUILD.md (Join-Path $folder 'README.md')
          "Commit: $env:GITHUB_SHA`nBuild: $env:GITHUB_RUN_NUMBER" | Set-Content (Join-Path $folder 'BUILD.txt') -Encoding utf8
          Compress-Archive -Path $folder -DestinationPath artifacts/NEXUS-win-x64.zip
          Get-FileHash artifacts/NEXUS-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  NEXUS-win-x64.zip" } | Set-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Windows-x64
          path: |
            artifacts/NEXUS-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
